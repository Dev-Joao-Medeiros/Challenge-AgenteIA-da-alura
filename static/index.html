<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyche Pay — Assistente Virtual</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <button id="btn-nova-conversa" class="btn-nova-conversa">+ Nova conversa</button>
            <div id="lista-conversas" class="lista-conversas"></div>
        </aside>

        <main class="chat-wrapper">
            <header class="chat-header">
                <h1>🤖 Tyche Pay — Assistente Virtual</h1>
            </header>

            <div id="historico" class="historico"></div>

            <form id="form-pergunta" class="form-pergunta">
                <input type="text" id="input-pergunta" placeholder="Digite sua pergunta..." autocomplete="off"
                    required />
                <button type="submit">Enviar</button>
            </form>

            <p class="disclaimer disclaimer-rodape">
                Você está conversando com um agente de <strong>Inteligência Artificial</strong>,
                não com uma pessoa. As respostas são baseadas nos documentos internos da empresa.
            </p>
        </main>
    </div>

    <script src="/static/main.js"></script>
</body>

</html>
